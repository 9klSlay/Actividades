<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Herbi 🌡️</title>

<link rel="stylesheet" href="tarea1.css">

</head>

<body>

<main class="contenedor">

    <div class="tarjeta">

        <div class="icono">🌡️</div>

        <h1>Herbi Temperature</h1>

        <p>
            Escribe la temperatura de Herbi
            para descubrir cómo está.
        </p>

        <div class="entrada">

            <label for="temperatura">
                Temperatura
            </label>

            <input
                type="number"
                id="temperatura"
                placeholder="Ej: 25"
            >

            <button id="boton">
                Comprobar temperatura
            </button>

        </div>

        <div class="resultado">

            <p id="mensaje">
                Aquí aparecerá el estado de Herbi 🌡️
            </p>

        </div>

        <div class="decoracion">
            <span>❄️</span>
            <span>🌞</span>
            <span>🔥</span>
        </div>

    </div>

</main>

<footer>
    <p>
        Hecho con mucho amor -
        <a href="https://9klslay.github.io" target="_blank">
            9k lSlay
        </a>
    </p>
</footer>

<script src="script.js"></script>

</body>

</html>
