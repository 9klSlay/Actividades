<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 8 - Checkboxes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <div class="tarjeta">
            <h1>Practica el DOM</h1>
            <p class="descripcion">Marca al menos una opción para habilitar el botón Enviar.</p>

            <div class="opcion">
                <input type="checkbox" id="opt1">
                <label for="opt1">Opción 1</label>
            </div>

            <div class="opcion">
                <input type="checkbox" id="opt2">
                <label for="opt2">Opción 2</label>
            </div>

            <button id="revisar">Revisar</button>
            <button id="btn-enviar" disabled>Enviar</button>

            <p id="resultado"></p>
        </div>
    </main>

    <footer>
        <p>Hecho con mucho amor - <a href="https://9klslay.github.io/9k_lSlay/">9k lSlay</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
